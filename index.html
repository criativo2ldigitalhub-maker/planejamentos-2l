<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planejamentos · 2L Digital Hub</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗓️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="config.js"></script>
<style>
:root{
  --bg:#f5f5f3; --surface:#ffffff; --surface2:#ecece9; --line:#deded9; --text:#151515; --muted:#6a6a64;
  --accent:#e85d0c; --accent-ink:#ffffff; --accent-soft:#fdebdf; --logo-filter:invert(1); --shadow:0 10px 40px rgba(0,0,0,.18);
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#0a0a0a; --surface:#151515; --surface2:#1e1e1e; --line:#2a2a2a; --text:#f3f3f1; --muted:#9a9a94;
  --accent:#ff6b1a; --accent-ink:#0a0a0a; --accent-soft:#2a1609; --logo-filter:none; --shadow:0 10px 40px rgba(0,0,0,.6);
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0a0a0a; --surface:#151515; --surface2:#1e1e1e; --line:#2a2a2a; --text:#f3f3f1; --muted:#9a9a94;
  --accent:#ff6b1a; --accent-ink:#0a0a0a; --accent-soft:#2a1609; --logo-filter:none; --shadow:0 10px 40px rgba(0,0,0,.6);
  color-scheme:dark; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Poppins,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
img{max-width:100%}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:22px;filter:var(--logo-filter)}
.brand span{color:var(--muted);font-size:13px;border-left:1px solid var(--line);padding-left:12px;white-space:nowrap}
.month{margin-left:auto;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.month button{border:0;background:none;width:38px;height:38px;border-radius:999px;font-size:18px;color:var(--muted)}
.month button:hover{color:var(--accent)}
.month strong{font-weight:600;font-size:14px;min-width:150px;text-align:center}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;padding:0 14px;font-size:13px;color:var(--muted)}
.iconbtn:hover{color:var(--text)}
.iconbtn.round{width:40px;padding:0;display:grid;place-items:center}
.savestate{font-size:12px;color:var(--muted);min-width:60px;text-align:right}
.hidden{display:none!important}

main{max-width:1180px;margin:0 auto;padding:24px 18px 150px}
.banner{background:var(--accent-soft);border-radius:12px;padding:12px 16px;font-size:13px;margin-bottom:20px}
h1{font-size:clamp(26px,4vw,34px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin:0}
h2{font-size:19px;font-weight:600;margin:0}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}

.listhead{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.listhead .grow{flex:1;min-width:220px}
.btn{border:0;border-radius:10px;height:44px;padding:0 18px;font-weight:600;font-size:14px;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;text-decoration:none}
.btn:hover{filter:brightness(1.06)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none;border:1px solid var(--line)}
.btn.danger{background:none;color:#d4442a;border:1px solid currentColor}
.btn.small{height:38px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:default}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:220px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:0 14px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;overflow-x:auto}
.seg button{border:0;background:none;border-radius:8px;padding:0 12px;height:36px;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--text);font-weight:600}
.seg b{font-weight:600;margin-left:4px;color:var(--accent)}

.clients{display:grid;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.row:hover{border-color:var(--accent)}
.row .name{font-weight:600;font-size:15px}
.row .pkg{color:var(--muted);font-size:13px}
.pill{font-size:12px;font-weight:600;border-radius:999px;padding:5px 11px;white-space:nowrap;border:1px solid var(--line);color:var(--muted)}
.pill.prog{border-color:var(--accent);color:var(--accent)}
.pill.sent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:40px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

.back{border:0;background:none;color:var(--muted);padding:0;margin-bottom:10px;font-size:14px}
.back:hover{color:var(--accent)}
.ehead{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;margin-bottom:28px}
.ehead .grow{flex:1;min-width:220px}
.pkgline{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.chip.off{color:var(--muted);text-decoration:line-through}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:18px}
.sechead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sechead .count{color:var(--muted);font-size:13px}
.sechead .count.ok{color:var(--accent);font-weight:600}
.sechead .right{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}

.drop{display:block;border:1.5px dashed var(--line);border-radius:12px;padding:22px;text-align:center;color:var(--muted);cursor:pointer;margin-bottom:16px;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.drop strong{color:var(--text);font-weight:600}
.drop input{display:none}
.wkgroup{margin-bottom:18px}
.wkgroup>.wkh{display:flex;align-items:baseline;gap:10px;margin:0 0 10px}
.wkgroup>.wkh b{font-weight:600}
.wkgroup>.wkh span{color:var(--muted);font-size:13px}
.arts{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.art{background:var(--surface2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.art .imgw{position:relative;aspect-ratio:4/5;background:var(--bg)}
.art .imgw img{width:100%;height:100%;object-fit:contain;display:block}
.art .num{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px}
.art .up{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.55);color:#fff;font-size:13px;text-align:center;padding:10px}
.art.uploading .up,.art.gone .up{display:flex}
.art .body{padding:10px;display:grid;gap:8px}
.field{display:grid;gap:4px}
.field>span{font-size:12px;color:var(--muted)}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:13.5px}
select.in{height:38px}
textarea.in{resize:vertical;min-height:70px;line-height:1.45}
.artctl{display:flex;gap:6px}
.artctl button{flex:1;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:13px;color:var(--muted)}
.artctl button:hover{color:var(--text)}
.artctl button.rm:hover{color:#d4442a;border-color:#d4442a}
.art .badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 9px}
.art.over{outline:2px dashed var(--accent);outline-offset:-2px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:6px}
.card{display:grid;gap:4px;align-content:start}
.card .th{position:relative;aspect-ratio:4/5;border-radius:6px;overflow:hidden;background:var(--bg)}
.card .th img{width:100%;height:100%;object-fit:cover;display:block}
.card .th span{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.7);color:#fff;font-size:10.5px;font-weight:600;border-radius:999px;padding:0 6px}
.card.uploading .th img{opacity:.4}
.card .cb{display:flex;gap:3px}
.card .cb button{flex:1;height:22px;padding:0;border-radius:5px;border:1px solid var(--line);background:var(--surface);font-size:11px;color:var(--muted)}
.card .cb button:hover{color:var(--text)}
.card .cb button.rm:hover{color:#d4442a;border-color:#d4442a}
.addcard{aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:6px;display:grid;place-content:center;text-align:center;font-size:11px;line-height:1.2;color:var(--muted);cursor:pointer}
.addcard:hover{border-color:var(--accent);color:var(--text)}
.addcard b{font-size:18px;font-weight:500}
.addcard input,.addcards input{display:none}
.addcards{display:block;height:34px;line-height:32px;border-radius:8px;border:1px dashed var(--line);text-align:center;font-size:13px;color:var(--muted);cursor:pointer}
.addcards:hover{border-color:var(--accent);color:var(--text)}

.recs{display:grid;gap:10px}
.rec{display:grid;grid-template-columns:150px 110px 1fr 40px;gap:8px;align-items:center}
.rec .x{height:40px;border-radius:8px;border:1px solid var(--line);background:none;color:var(--muted)}
.rec .x:hover{color:#d4442a;border-color:#d4442a}
.rec .src{font-size:11px;color:var(--accent);font-weight:600}
.rec{grid-template-columns:150px 110px 130px 1fr 40px}
.rec .st.pend{border-color:var(--accent);color:var(--accent);font-weight:600}
.rec-wrap{display:grid;gap:4px}
.recmeta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px}
.tag{font-size:11.5px;border-radius:999px;padding:2px 9px;background:var(--surface2);color:var(--muted)}
.tag.hol{background:var(--accent-soft);color:var(--accent);font-weight:600}
.linkbtn{border:0;background:none;color:var(--accent);font-size:12px;font-weight:600;text-decoration:underline;padding:0}
.sugbox{border:1.5px solid var(--accent);border-radius:12px;padding:14px;margin-bottom:16px;display:grid;gap:12px;background:var(--accent-soft)}
.sughead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.sug{display:grid;gap:6px;background:var(--surface);border-radius:10px;padding:10px}
.sugtitle{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:13.5px;font-weight:600}
.sugrow{display:grid;grid-template-columns:150px 110px 1fr;gap:8px;align-items:center}
.sugbtns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.warn{display:block;color:var(--accent);font-weight:600}
@media (max-width:640px){.arts{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.art .body{padding:8px}.rec{grid-template-columns:1fr 1fr 40px}.rec .st{grid-column:1/3}.rec .note{grid-column:1/-1}.sugrow{grid-template-columns:1fr 1fr}.sugbtns{grid-column:1/-1;justify-content:stretch}.sugbtns .btn{flex:1}}

.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px))}
.actions-in{max-width:1180px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sent{display:flex;align-items:center;gap:8px;font-size:14px;margin-right:auto;cursor:pointer}
.sent input{width:20px;height:20px;accent-color:var(--accent)}
@media (max-width:560px){.actions-in .btn{flex:1}.sent{width:100%}}

.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal{align-items:center;padding:20px}}
.sheet{background:var(--surface);width:100%;max-width:540px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow)}
@media (min-width:640px){.sheet{border-radius:18px}}
.sheet h2{margin-bottom:16px}
.sheet h3{font-size:15px;font-weight:600;margin:10px 0 0}
.form{display:grid;gap:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.sheet .foot{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap}
.sheet .foot .spacer{flex:1}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.rowbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.login{min-height:70vh;display:grid;place-items:center}
.login form{width:100%;max-width:360px;display:grid;gap:14px}
.login img{height:28px;filter:var(--logo-filter);margin-bottom:10px}

.preview{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.preview .bar{display:flex;gap:10px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;border-bottom:1px solid var(--line)}
.preview .bar strong{flex:1;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview iframe{flex:1;border:0;width:100%;background:#0a0a0a}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:11px 18px;border-radius:10px;font-size:14px;z-index:40;max-width:90vw;box-shadow:var(--shadow)}
.loading{color:var(--muted);padding:40px 0;text-align:center}
.month.hidden+.savestate{margin-left:auto}
.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;border-radius:999px;height:32px;padding:0 14px;font-size:13px;color:var(--muted);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.pill.onboarding{border-color:var(--accent);color:var(--accent)}
.pill.ativo{background:var(--surface2);color:var(--text)}
.pill.pausado,.pill.encerrado{border-style:dashed}
.rowr{display:flex;gap:10px;align-items:center}
.rowr .val{font-size:13px;font-weight:600;white-space:nowrap}
.lock{font-size:12px;font-weight:500;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 9px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.grid2 .wide{grid-column:1/-1}
.in.bad{border-color:#d4442a}
.d4{display:grid;gap:6px}
.d4row{display:grid;grid-template-columns:minmax(150px,230px) 1fr auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--surface2)}
.d4row code{font:12px/1.3 ui-monospace,Consolas,monospace;color:var(--muted);word-break:break-word}
.d4row .v{font-size:13.5px;word-break:break-word}
.d4row .v.miss{color:#d4442a;font-weight:600}
.d4row button{height:32px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:12.5px;padding:0 12px;color:var(--muted)}
.d4row button:hover{color:var(--accent);border-color:var(--accent)}
.linkbox{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.linkbox .in{flex:1;min-width:200px}
.pub{max-width:640px;margin:0 auto}
.pub .sec h2{margin-bottom:12px}
.req{color:var(--accent)}
@media (max-width:640px){.d4row{grid-template-columns:1fr auto}.d4row code{grid-column:1/-1}}
@media (max-width:560px){.brand span{display:none}.month{order:4;width:100%;justify-content:space-between;margin-left:0}.month strong{flex:1}.top-in{gap:8px;padding:12px 14px}.brand img{height:18px}.savestate{margin-left:auto;min-width:0}.tabs{order:3;width:100%}.tabs button{flex:1}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><img id="logo" alt="2L Digital Hub"><span id="brandSub">Planejamentos</span></div>
  <nav class="tabs hidden" id="tabs" aria-label="Seções"><button data-tab="plan">Planejamentos</button><button data-tab="clients">Clientes</button></nav>
  <div class="month hidden" id="monthBox" aria-label="Mês do planejamento">
    <button id="mPrev" aria-label="Mês anterior">‹</button><strong id="mLabel"></strong><button id="mNext" aria-label="Próximo mês">›</button>
  </div>
  <div class="savestate" id="saveState" aria-live="polite"></div>
  <button class="iconbtn round" id="themeBtn"></button>
  <button class="iconbtn hidden" id="openSettings">Ajustes</button>
</div></header>
<main id="main"><div class="loading">Carregando…</div></main>

const pad=n=>String(n).padStart(2,"0");
const mkey=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const shiftMonth=(k,n)=>{const[y,m]=k.split("-").map(Number);return mkey(new Date(y,m-1+n,1))};

const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/\s+/g," ").trim();
const nextMonthKey=()=>{const d=new Date();return mkey(new Date(d.getFullYear(),d.getMonth()+1,1))};
function weeks(k){const[y,m]=k.split("-").map(Number);const last=new Date(y,m,0).getDate();const r=[[1,7],[8,14],[15,21],[22,28]];if(last>28)r.push([29,last]);return r}
function weekRange(k,w){const r=weeks(k)[w-1];if(!r)return"";return r[0]===r[1]?`dia ${r[0]}`:`${r[0]} a ${r[1]} de ${monthName(k)}`}

function makeDemoStore(){
  const KEY="planejamentos-2l-demo";
  const load=()=>{let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch(e){}db=db||{};for(const k of["clients","plans","settings","priv","forms"])db[k]=db[k]||{};return db};
  const save=db=>{localStorage.setItem(KEY,JSON.stringify(db))};
  return{
    demo:true,
    async session(){return true},
    async myRole(){try{return localStorage.getItem("demo-role")||"admin"}catch(e){return"admin"}},
    async listPrivate(){return load().priv},
    async mergePrivate(cid,patch){const db=load();db.priv[cid]={...db.priv[cid],...patch};save(db);return db.priv[cid]},
    async listForms(){return Object.values(load().forms)},
    async createForm(cid){const db=load(),f={token:rid("t"),client_id:cid,created_at:new Date().toISOString(),submitted_at:null};db.forms[f.token]=f;save(db);return f},
    async formInfo(t){const db=load(),f=db.forms[t];return f?{name:db.clients[f.client_id]?.name||"",submitted:!!f.submitted_at}:null},
    async submitForm(t,payload){const db=load(),f=db.forms[t];if(!f||f.submitted_at)return false;f.submitted_at=new Date().toISOString();db.priv[f.client_id]={...db.priv[f.client_id],...payload};save(db);return true},
    async listTeam(){return[]},async saveTeam(){},async deleteTeam(){},
    async listClients(){return Object.values(load().clients)},
    async saveClient(c){const db=load();if(!c.id)c.id=rid("c");db.clients[c.id]={...db.clients[c.id],...c};save(db);return db.clients[c.id]},
    async deleteClient(id){const db=load();delete db.clients[id];for(const k in db.plans)if(db.plans[k].client_id===id)delete db.plans[k];save(db)},
    async listPlans(month){const out={};for(const p of Object.values(load().plans))if(p.month===month)out[p.client_id]=p;return out},
    async savePlan(p){const db=load();db.plans[p.client_id+"_"+p.month]=p;save(db)},
    async getSettings(){return load().settings||{}},
    async saveSettings(s){const db=load();db.settings=s;save(db)},
    async uploadImage(blob){const url=await blobToDataURL(blob);return{path:"",url}},
    async removeImages(){},
    async oldPlans(cut){return Object.values(load().plans).filter(p=>p.month<cut)},
    async dumpAll(){return load()}
  };
}
function makeSupaStore(){
  const sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const ok=({data,error})=>{if(error)throw error;return data};
  async function all(table){let out=[],from=0;for(;;){const d=ok(await sb.from(table).select("*").range(from,from+999));out=out.concat(d);if(d.length<1000)return out;from+=1000}}
  return{
    sb,demo:false,
    async session(){const{data}=await sb.auth.getSession();return !!data.session},
    async signIn(email,password){const{error}=await sb.auth.signInWithPassword({email,password});if(error)throw error},
    async signOut(){await sb.auth.signOut()},
    async myRole(){return ok(await sb.rpc("my_role"))||"equipe"},
    async listPrivate(){const out={};for(const r of ok(await sb.from("client_private").select("client_id,data")))out[r.client_id]=r.data||{};return out},
    async mergePrivate(cid,patch){return ok(await sb.rpc("merge_private",{cid,patch}))||{}},
    async listForms(){return ok(await sb.from("client_forms").select("*").order("created_at"))},
    async createForm(cid){return ok(await sb.from("client_forms").insert({client_id:cid}).select().single())},
    async formInfo(t){const{data,error}=await sb.rpc("onboarding_info",{t});if(error)return null;return data},
    async submitForm(t,payload){return ok(await sb.rpc("submit_onboarding",{t,payload}))===true},
    async listTeam(){return ok(await sb.from("team").select("*").order("email"))},
    async saveTeam(email,role){ok(await sb.from("team").upsert({email,role}))},
    async deleteTeam(email){ok(await sb.from("team").delete().eq("email",email))},
    async listClients(){return ok(await sb.from("clients").select("*"))},
    async saveClient(c){const row={...c};if(!row.id)delete row.id;return ok(await sb.from("clients").upsert(row).select().single())},
    async deleteClient(id){ok(await sb.from("clients").delete().eq("id",id))},
    async listPlans(month){const out={};for(const p of ok(await sb.from("plans").select("*").eq("month",month)))out[p.client_id]=p;return out},
    async savePlan(p){ok(await sb.from("plans").upsert({...p,updated_at:new Date().toISOString()}))},
    async getSettings(){const d=ok(await sb.from("settings").select("data").eq("id",1).maybeSingle());return d?d.data||{}:{}},
    async saveSettings(s){ok(await sb.from("settings").upsert({id:1,data:s}))},
    async uploadImage(blob,month){
      const path=`${month}/${crypto.randomUUID?crypto.randomUUID():rid("i")}.jpg`;
      ok(await sb.storage.from("artes").upload(path,blob,{contentType:"image/jpeg",cacheControl:"31536000"}));
      return{path,url:sb.storage.from("artes").getPublicUrl(path).data.publicUrl};
    },
    async removeImages(paths){paths=paths.filter(Boolean);for(let i=0;i<paths.length;i+=100)ok(await sb.storage.from("artes").remove(paths.slice(i,i+100)))},
    async oldPlans(cut){return ok(await sb.from("plans").select("*").lt("month",cut))},
    async dumpAll(){return{clients:await all("clients"),plans:await all("plans"),settings:await this.getSettings(),private:S.admin?await all("client_private"):undefined,exportedAt:new Date().toISOString()}}
  };
}

const writers={},timers={};
function updateSaveState(){const busy=Object.values(writers).some(w=>w.busy||w.dirty)||Object.keys(timers).length||S.uploads;$("#saveState").textContent=S.loaded?(busy?"Salvando…":"Salvo"):""}
function queueWrite(key,task){
  const w=writers[key]||(writers[key]={busy:false,dirty:false});
  w.task=task;w.dirty=true;updateSaveState();if(!w.busy)flush(key);
}
async function flush(key){
  const w=writers[key];w.busy=true;
  while(w.dirty){w.dirty=false;
    try{await w.task()}
    catch(e){console.error(e);
      if(e&&e.name==="QuotaExceededError")toast("O modo demonstração lotou o espaço do navegador. Configure o Supabase para salvar de verdade.",6000);
      else toast("Não foi possível salvar. Confira sua internet e tente de novo.",5000);}
  }
  w.busy=false;updateSaveState();
}
function saveSoon(key,task,delay=600){clearTimeout(timers[key]?.t);timers[key]={t:setTimeout(()=>{delete timers[key];queueWrite(key,task)},delay),task};updateSaveState()}
function flushTimers(){for(const k in timers){clearTimeout(timers[k].t);const task=timers[k].task;delete timers[k];queueWrite(k,task)}}
window.addEventListener("beforeunload",e=>{if(Object.keys(timers).length||S.uploads||Object.values(writers).some(w=>w.busy||w.dirty)){flushTimers();e.preventDefault();e.returnValue=""}});

/* =================== GOOGLE AGENDA =================== */
const G={token:null,exp:0,client:null,cache:{},ok:null,err:null};
const gEnabled=()=>!!CFG.GOOGLE_CLIENT_ID;
function gToken(){
  return new Promise((res,rej)=>{
    if(G.token&&Date.now()<G.exp-60000)return res(G.token);
    if(!(window.google&&google.accounts&&google.accounts.oauth2))return rej({code:"nogis"});
    G.ok=r=>{G.token=r.access_token;G.exp=Date.now()+(+r.expires_in||3600)*1000;res(G.token)};G.err=rej;
    if(!G.client)G.client=google.accounts.oauth2.initTokenClient({client_id:CFG.GOOGLE_CLIENT_ID,scope:"https://www.googleapis.com/auth/calendar.readonly",
      callback:r=>{if(r.error)G.err&&G.err(r);else G.ok&&G.ok(r)},error_callback:e=>G.err&&G.err(e)});
    G.client.requestAccessToken({prompt:""});
  });
}
async function gget(path){
  const r=await fetch("https://www.googleapis.com/calendar/v3/"+path,{headers:{Authorization:"Bearer "+G.token}});
  if(r.status===401){G.token=null;throw{code:"auth"}}
  if(!r.ok)throw{code:"http",status:r.status};
  return r.json();
}
async function monthEvents(month,force){
  if(!force&&G.cache[month])return G.cache[month];
  await gToken();
  const[y,m]=month.split("-").map(Number);
  const tMin=encodeURIComponent(new Date(y,m-1,1).toISOString()),tMax=encodeURIComponent(new Date(y,m,1).toISOString());
  let cals=[],pt="";
  do{const j=await gget("users/me/calendarList?maxResults=250"+(pt?"&pageToken="+pt:""));cals.push(...(j.items||[]));pt=j.nextPageToken}while(pt);
  cals=cals.filter(c=>!/#holiday@|#contacts@|#weeknum@|#birthday/.test(c.id));
  const seen=new Set(),out=[];
  await Promise.all(cals.map(async c=>{
    let pt="";
    do{
      const j=await gget(`calendars/${encodeURIComponent(c.id)}/events?singleEvents=true&orderBy=startTime&maxResults=2500&timeMin=${tMin}&timeMax=${tMax}`+(pt?"&pageToken="+pt:"")).catch(()=>({}));
      for(const e of j.items||[]){
        if(e.status==="cancelled"||!e.start)continue;
        const st=e.start.dateTime||e.start.date,key=(e.iCalUID||e.id)+"|"+st;
        if(seen.has(key))continue;seen.add(key);
        let date,time="";
        if(e.start.dateTime){const d=new Date(e.start.dateTime);date=mkey(d)+"-"+pad(d.getDate());time=pad(d.getHours())+":"+pad(d.getMinutes())}
        else date=e.start.date;
        if(!date.startsWith(month))continue;
        out.push({key,summary:e.summary||"",date,time});
      }
      pt=j.nextPageToken;
    }while(pt);
  }));
  G.cache[month]=out;return out;
}
/* ---- nomes: "Black Car Multimarcas" também acha "Black Car" ---- */
const GENERIC=new Set("multimarcas multimarca veiculos veiculo automoveis automovel motors motor seminovos seminovo autos auto ltda me eireli e de da do das dos comercio centro automotivo protecao veicular mecanica loja grupo".split(" "));
const clean=s=>norm(s).replace(/[^a-z0-9]+/g," ").trim();
function clientPhrases(c){
  const name=String(c.name||"").trim(),full=clean(name),words=name.split(/\s+/).filter(w=>!GENERIC.has(clean(w))),core=clean(words.join(" "));
  const out=[{p:full,d:name,kind:"exato"}];
  if(core&&core!==full)out.push({p:core,d:words.join(" "),kind:"parecido"});
  String(c.calendar_name||"").split(",").map(a=>a.trim()).filter(Boolean).forEach(a=>out.push({p:clean(a),d:a,kind:"exato"}));
  return out.filter(x=>x.p.length>=2);
}
function bestSpan(title,phrases){
  let best=null;
  for(const{p,kind}of phrases){
    let i=-1;
    while((i=title.indexOf(p,i+1))>=0){
      const okL=i===0||title[i-1]===" ",okR=i+p.length===title.length||title[i+p.length]===" ";
      if(okL&&okR&&(!best||p.length>best.e-best.s))best={s:i,e:i+p.length,kind};
    }
  }
  return best;
}
// eventos do mês que são de cada cliente (um evento pode ser de dois clientes que gravam juntos)
function matchEvents(events){
  const kw=clean(settings().keyword),ph=S.clients.map(c=>[c.id,clientPhrases(c)]),res={};
  for(const e of events){
    const t=clean(e.summary);if(kw&&!(" "+t+" ").includes(" "+kw))continue;
    const spans=[];for(const[id,p]of ph){const b=bestSpan(t,p);if(b)spans.push({id,...b})}
    for(const a of spans){
      if(spans.some(o=>o!==a&&o.s<=a.s&&o.e>=a.e&&o.e-o.s>a.e-a.s))continue; // "WR" perde para "WR Consórcios"
      (res[a.id]=res[a.id]||[]).push({...e,match:a.kind});
    }
  }
  return res;
}
function holidayMap(y){
  const m={},put=(d,n)=>{m[mkey(d)+"-"+pad(d.getDate())]=n};
  [[1,1,"Confraternização Universal"],[4,21,"Tiradentes"],[5,1,"Dia do Trabalho"],[9,7,"Independência do Brasil"],[10,12,"Nossa Senhora Aparecida"],[11,2,"Finados"],[11,15,"Proclamação da República"],[11,20,"Consciência Negra"],[12,25,"Natal"]].forEach(([mm,dd,n])=>put(new Date(y,mm-1,dd),n));
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,mo=Math.floor((a+11*h+22*l)/451),
    em=Math.floor((h+l-7*mo+114)/31),ed=((h+l-7*mo+114)%31)+1,easter=new Date(y,em-1,ed),off=n=>{const x=new Date(easter);x.setDate(x.getDate()+n);return x};
  put(off(-48),"Carnaval");put(off(-47),"Carnaval");put(off(-2),"Sexta-feira Santa");put(off(60),"Corpus Christi");
  String(settings().holidays||"").split(/\n|;/).forEach(line=>{const r=line.trim().match(/^(\d{1,2})\/(\d{1,2})\s*[-–]?\s*(.*)$/);if(r)put(new Date(y,+r[2]-1,+r[1]),r[3]||"Feriado")});
  return m;
}
const holidayOf=date=>date?holidayMap(+date.slice(0,4))[date]||"":"";
function applyEvents(c,plan,found){
  found=found||[];
  const old=plan.recordings||[],dis=new Set(plan.dismissed||[]),byKey={};
  old.filter(r=>r.gkey).forEach(r=>byKey[r.gkey]=r);
  const keys=new Set(found.map(e=>e.key));
  // sugestões que sumiram da agenda saem; confirmadas ficam
  let recs=old.filter(r=>!(r.status==="sugerida"&&r.gkey&&!keys.has(r.gkey)));
  let novas=0;
  for(const e of found){
    if(dis.has(e.key))continue;
    const r=byKey[e.key];
    if(!r){recs.push({id:rid("r"),gkey:e.key,gcal:true,status:"sugerida",title:e.summary,match:e.match,date:e.date,time:e.time,note:""});novas++}
    else if(r.status==="sugerida"){Object.assign(r,{title:e.summary,match:e.match,date:e.date,time:e.time})}
    else if(r.date!==e.date||r.time!==e.time){r.calDate=e.date;r.calTime=e.time}else{r.calDate="";r.calTime=""}
  }
  plan.recordings=recs.sort((a,b)=>((a.date||"9")+(a.time||"")).localeCompare((b.date||"9")+(b.time||"")));
  return novas;
}
function gError(e){
  console.error(e);
  if(e&&e.code==="nogis")toast("O Google ainda está carregando. Tente de novo em alguns segundos.");
  else if(e&&(e.type==="popup_closed"||e.error==="access_denied"))toast("Acesso à agenda não autorizado.");

}

function spreadWeeks(d,c,from){

async function compress(file){
  const bmp=await createImageBitmap(file);
  const s=Math.min(1,1440/Math.max(bmp.width,bmp.height));
  const w=Math.round(bmp.width*s),h=Math.round(bmp.height*s);
  const c=document.createElement("canvas");c.width=w;c.height=h;
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(bmp,0,0,w,h);
  return{blob:await new Promise(r=>c.toBlob(r,"image/jpeg",.85)),w,h};
}
const blobToDataURL=b=>new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.onerror=rej;fr.readAsDataURL(b)});
async function addFiles(files){
  if(!files.length)return;
  const d=S.draft,c=client(),start=d.arts.length;
  const items=files.map(f=>({id:rid("a"),uploading:true,preview:URL.createObjectURL(f),caption:"",week:0,_f:f}));
  items.forEach(a=>d.arts.push(a));
  const nw=weeks(d.month).length,total=Math.max(+c.arts||0,d.arts.length),per=Math.max(1,Math.ceil(total/4));
  items.forEach((a,k)=>a.week=Math.min(nw,Math.floor((start+k)/per)+1));
  await sendImages(d,d.arts,items);
}
async function addCards(art,files){
  if(!files.length)return;
  const d=S.draft,items=files.map(f=>({id:rid("k"),uploading:true,preview:URL.createObjectURL(f),_f:f}));
  art.cards=art.cards||[];art.cards.push(...items);
  await sendImages(d,art.cards,items);
}
// comprime e envia cada imagem; a que falhar sai da lista
async function sendImages(d,list,items){
  S.uploads+=items.length;renderEditor();
  for(const a of items){
    try{
      const{blob,w,h}=await compress(a._f);a.w=w;a.h=h;
      const r=await store.uploadImage(blob,d.month);a.url=r.url;a.path=r.path;
      delete a.uploading;
      const el=document.querySelector(`[data-id="${a.id}"]`);if(el)el.classList.remove("uploading");
    }catch(e){
      console.error(e);const i=list.indexOf(a);if(i>=0)list.splice(i,1);
      toast("Uma imagem não pôde ser enviada. Tente de novo.");if(S.draft===d)renderEditor();
    }finally{delete a._f;S.uploads--;savePlanDraft(d,0)}
  }
  if(S.draft===d)renderEditor();
}

const digits=s=>String(s||"").replace(/\D/g,"");
function mask(kind,v){
  const d=digits(v);
  if(kind==="cpf")return d.slice(0,11).replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d)/,"$1.$2").replace(/(\d{3})(\d{1,2})$/,"$1-$2");
  if(kind==="cnpj")return d.slice(0,14).replace(/^(\d{2})(\d)/,"$1.$2").replace(/^(\d{2})\.(\d{3})(\d)/,"$1.$2.$3").replace(/\.(\d{3})(\d)/,".$1/$2").replace(/(\d{4})(\d)/,"$1-$2");
  if(kind==="cep")return d.slice(0,8).replace(/(\d{5})(\d)/,"$1-$2");
  if(kind==="phone"){const x=d.slice(0,11);return x.replace(/(\d{2})(\d)/,"($1) $2").replace(x.length>10?/(\d{5})(\d)/:/(\d{4})(\d)/,"$1-$2")}
  if(kind==="uf")return String(v||"").replace(/[^a-z]/gi,"").slice(0,2).toUpperCase();
  return v;
}
function cpfOk(v){const d=digits(v);if(d.length!==11||/^(\d)\1+$/.test(d))return false;
  for(const n of[9,10]){let s=0;for(let i=0;i<n;i++)s+=+d[i]*(n+1-i);if(s*10%11%10!==+d[n])return false}return true}
function cnpjOk(v){const d=digits(v);if(d.length!==14||/^(\d)\1+$/.test(d))return false;
  for(const n of[12,13]){let s=0,w=n-7;for(let i=0;i<n;i++){s+=+d[i]*w--;if(w<2)w=9}if((s%11<2?0:11-s%11)!==+d[n])return false}return true}
const fieldOk=(o,v)=>!v||(o.mask==="cpf"?cpfOk(v):o.mask==="cnpj"?cnpjOk(v):o.type==="email"?/^\S+@\S+\.\S+$/.test(v):true);
// "1500", "1.500" ou "1500,5" viram "1.500,00" (o D4Sign já coloca o R$)
const moneyNum=s=>{s=String(s||"").trim();if(!s)return NaN;return s.includes(",")?+s.replace(/[^\d,]/g,"").replace(",","."):+s.replace(/[^\d.]/g,"").replace(/\.(?=\d{3}(\D|$))/g,"")};
const money=s=>{const n=moneyNum(s);return isFinite(n)?n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2}):String(s||"").trim()};
const brDate=iso=>iso?iso.split("-").reverse().join("/"):"";

function bindFicha(c){
  const m=$("#main"),cid=c.id;
  const paintD4=()=>{const box=$("#d4");if(box)box.innerHTML=d4HTML(c,S.priv[cid]||{})};
  const chg=(fn,re)=>()=>{fn();saveClientSoon(c);re?renderFicha():paintD4()};
  $("#back").onclick=renderClients;
  const tp=$("#toPlan");if(tp)tp.onclick=()=>{flushTimers();openClient(cid)};
  $("#kName").oninput=e=>{const v=e.target.value.trim();if(!v)return;c.name=v;saveClientSoon(c);$("h1",m).textContent=v};
  $("#kStatus").onchange=chg(()=>{c.status=$("#kStatus").value},true);
  $("#kPlan").onchange=chg(()=>{c.plan=$("#kPlan").value;const p=PLANS[c.plan];if(p)Object.assign(c,p)},true);
  $("#kDue").onchange=chg(()=>{c.due_day=+$("#kDue").value||null},true);
  $("#kVid").oninput=chg(()=>{c.videos=Math.max(0,+$("#kVid").value||0)});
  $("#kArt").oninput=chg(()=>{c.arts=Math.max(0,+$("#kArt").value||0)});
  $("#kVid").onchange=$("#kArt").onchange=()=>renderFicha();
  $("#kTraf").onchange=chg(()=>{c.traffic=$("#kTraf").checked},true);
  $("#kSoc").onchange=chg(()=>{c.social=$("#kSoc").checked},true);
  $("#kStart").onchange=chg(()=>{c.start_date=$("#kStart").value||null},true);
  const kc=$("#kCal");if(kc)kc.oninput=()=>{c.calendar_name=kc.value.trim();saveClientSoon(c)};
  $("#kNotes").oninput=e=>{c.pkg_notes=e.target.value;saveClientSoon(c)};
  if(!S.admin)return;

  const priv=$("#privSec");
  bindMasks(priv,F_CLIENT,(k,v)=>{savePriv(cid,k,v);paintD4()});
  $("#dealSec").querySelectorAll("[data-p]").forEach(el=>{
    const k=el.dataset.p,set=()=>{savePriv(cid,k,el.value.trim());paintD4()};
    el.addEventListener(el.tagName==="SELECT"||el.type==="date"?"change":"input",set);
    if(el.dataset.money)el.addEventListener("blur",()=>{const v=money(el.value);if(v!==el.value){el.value=v;set()}});
  });
  $("#d4").onclick=e=>{const b=e.target.closest("[data-cp]");if(!b)return;const x=d4Fields(c,S.priv[cid]||{})[+b.dataset.cp];
    copyText(x.v).then(ok=>{if(ok){b.textContent="Copiado";setTimeout(()=>{b.textContent="Copiar"},1400)}else msgModal(x.v)})};
  $("#copyAll").onclick=async()=>{const t=d4Fields(c,S.priv[cid]||{}).map(x=>`${x.k}: ${x.v}`).join("\n");if(await copyText(t))toast("Todos os campos copiados.");else msgModal(t)};
  const nf=$("#newForm");if(nf)nf.onclick=async()=>{
    if(S.forms[cid]?.submitted_at&&!confirm("Gerar um link novo? O que o cliente mandar de novo substitui os dados atuais."))return;
    nf.disabled=true;
    try{const f=await store.createForm(cid);S.forms[cid]=f;renderFicha();if(await copyText(formURL(f.token)))toast("Link copiado. Mande para o cliente.")}
    catch(e){console.error(e);toast("Não foi possível gerar o link.");nf.disabled=false}
  };
  const cf=$("#copyForm");if(cf)cf.onclick=async()=>{const u=$("#formLink").value;if(await copyText(u))toast("Link copiado.");else msgModal(u)};
  $("#delClient").onclick=async()=>{
    if(!confirm(`Excluir ${c.name}? A ficha, o contrato e todos os planejamentos dele serão apagados.`))return;
    try{flushTimers();await store.deleteClient(cid);S.clients=S.clients.filter(x=>x.id!==cid);delete S.plans[cid];delete S.priv[cid];renderClients()}
    catch(e){toast("Não foi possível excluir.")}
  };
}

async function renderPublicForm(token){
  document.title="Cadastro · 2L Digital Hub";$("#brandSub").textContent="Cadastro";renderTop();
  const m=$("#main");m.innerHTML=`<div class="loading">Carregando…</div>`;
  let info=null;try{info=await store.formInfo(token)}catch(e){console.error(e)}
  const done=(t,s)=>{m.innerHTML=`<div class="pub"><div class="empty"><strong>${t}</strong>${s}</div></div>`};
  if(!info)return done("Link inválido","Confira o link ou peça um novo para a equipe da 2L Digital Hub.");
  if(info.submitted)return done("Recebemos seus dados","Obrigado! Este formulário já foi enviado. Se precisar corrigir algo, fale com a gente.");
  const sec=(t,fields)=>`<section class="sec"><h2>${t}</h2><div class="grid2">${fields.map(([k,l,o])=>inputHTML(k,l,o,"")).join("")}</div></section>`;
  m.innerHTML=`<form class="pub" id="pf" novalidate>
    <h1>Dados para o contrato</h1><p class="sub" style="margin-bottom:22px">${esc(info.name)} · preencha uma vez, leva uns 3 minutos.</p>
    ${sec("Dados da empresa",F_EMPRESA)}${sec("Representante legal",F_REPR)}${sec("Financeiro",F_FIN)}
    <p class="hint" style="margin-bottom:14px">Usamos esses dados só para o contrato e a cobrança, conforme a LGPD.</p>
    <button class="btn primary" id="pfSend" style="width:100%">Enviar</button></form>`;
  bindMasks(m,F_CLIENT);
  $("#pf").onsubmit=async e=>{
    e.preventDefault();
    const payload={};let bad=null;
    m.querySelectorAll("input[data-k]").forEach(el=>{
      const[k,,o]=F_CLIENT.find(x=>x[0]===el.dataset.k),v=el.value.trim(),wrong=(o.req&&!v)||!fieldOk(o,v)||(o.mask==="uf"&&v&&v.length!==2);
      el.classList.toggle("bad",wrong);if(wrong&&!bad)bad=el;payload[k]=v;
    });
    if(bad){bad.focus();toast(bad.value.trim()?"Confira o campo marcado em vermelho.":"Preencha os campos obrigatórios (*).");return}
    const b=$("#pfSend");b.disabled=true;b.textContent="Enviando…";
    try{
      if(!await store.submitForm(token,payload))return done("Este link já foi usado","Se precisar corrigir algo, fale com a gente.");
      window.scrollTo(0,0);done("Recebemos seus dados","Obrigado! Já vamos preparar o seu contrato.");
    }catch(err){console.error(err);toast("Não foi possível enviar. Confira a internet e tente de novo.");b.disabled=false;b.textContent="Enviar"}
  };
}

function clientModal(c){

  $("#fName",w).focus();
  const upd=()=>{const h=$("#fCalHint",w);if(!h)return;const ph=clientPhrases({name:$("#fName",w).value,calendar_name:$("#fCal",w).value});h.textContent=ph.length?"Na agenda vamos procurar por: "+ph.map(x=>"“"+x.d+"”").join(", ")+". Só preencha se o nome lá for bem diferente.":""};

    const data={...(isNew?fresh:{id:c.id}),name,calendar_name:($("#fCal",w)?.value||c.calendar_name||"").trim(),plan:$("#fPlan",w).value,
      videos:Math.max(0,+$("#fVid",w).value||0),arts:Math.max(0,+$("#fArt",w).value||0),traffic:$("#fTraf",w).checked,social:$("#fSoc",w).checked};

const ROLES={admin:"Administrador",equipe:"Equipe",planejamento:"Só planejamentos"};
async function teamBox(box){
  let rows=[];try{rows=await store.listTeam()}catch(e){box.innerHTML=`<p class="hint">Não foi possível carregar.</p>`;return}
  const sel=(v,attr)=>`<select class="in" ${attr} style="width:auto">${Object.entries(ROLES).map(([k,t])=>`<option value="${k}" ${k===v?"selected":""}>${t}</option>`).join("")}</select>`;
  box.innerHTML=rows.map(r=>`<div class="rowbtns"><span style="flex:1;min-width:160px;font-size:13.5px;word-break:break-all">${esc(r.email)}</span>${sel(r.role,`data-role="${esc(r.email)}"`)}<button class="btn ghost small" data-rm="${esc(r.email)}">Tirar</button></div>`).join("")
    +`<div class="rowbtns"><input class="in" id="tEmail" type="email" placeholder="e-mail de login" style="flex:1;min-width:160px">${sel("planejamento",'id="tRole"')}<button class="btn ghost small" id="tAdd">Adicionar</button></div>
    <p class="hint"><b>Administrador</b> vê tudo, inclusive valores e contrato. <b>Equipe</b> vê planejamentos e clientes, sem valores. <b>Só planejamentos</b> não vê a aba de clientes nem edita pacotes. Quem não está na lista entra como equipe.</p>`;
  const admins=()=>rows.filter(r=>r.role==="admin").length;
  box.querySelectorAll("[data-role]").forEach(s=>s.onchange=async()=>{
    const r=rows.find(x=>x.email===s.dataset.role);
    if(r.role==="admin"&&s.value!=="admin"&&admins()<2){toast("Precisa ficar pelo menos um administrador.");s.value="admin";return}
    try{await store.saveTeam(r.email,s.value);r.role=s.value;toast("Acesso atualizado.")}catch(e){toast("Não foi possível mudar.");s.value=r.role}
  });
  box.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    const r=rows.find(x=>x.email===b.dataset.rm);
    if(r.role==="admin"&&admins()<2){toast("Precisa ficar pelo menos um administrador.");return}
    if(!confirm(`Tirar ${r.email} da lista? Ele passa a entrar como equipe.`))return;
    try{await store.deleteTeam(r.email);teamBox(box)}catch(e){toast("Não foi possível tirar.")}
  });
  $("#tAdd",box).onclick=async()=>{const e=$("#tEmail",box).value.trim().toLowerCase();if(!/^\S+@\S+\.\S+$/.test(e)){toast("Coloque um e-mail válido.");return}
    try{await store.saveTeam(e,$("#tRole",box).value);teamBox(box)}catch(err){toast("Não foi possível adicionar.")}};
}

const fmtHour=t=>t?t.replace(/^0(\d)/,"$1").replace(/:00$/,"h").replace(":","h"):"";
// texto que vai junto do arquivo no grupo do cliente (negrito e itálico do WhatsApp)
function waMessage(c,p){
  const recs=(p.recordings||[]).filter(r=>r.date&&r.status!=="sugerida").sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));
  const lines=[`Olá, pessoal da *${c.name}*! 👋`,"",`Segue o planejamento de *${monthName(p.month)} de ${p.month.split("-")[0]}* 🗓️ (arquivo logo abaixo).`];
  if(recs.length)lines.push("","🎬 *Datas de gravação*",...recs.map(r=>{const d=pdate(r.date);
    return `• ${cap(WEEK[d.getDay()])}, ${fmtShort(r.date)}${r.time?` às ${fmtHour(r.time)}`:""}${r.status==="adefinir"?" _(a definir)_":""}${r.note?` – ${r.note}`:""}`}));
  lines.push("","Qualquer ajuste, é só chamar a gente!");
  return lines.join("\n");
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);return true}
  catch(e){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();
    let ok=false;try{ok=document.execCommand("copy")}catch(_){}a.remove();return ok}
}

  const fig=a=>{const cs=(a.cards||[]).filter(k=>k.url),fc=a.caption?`<figcaption>${esc(a.caption)}</figcaption>`:"";

  let artBlocks="";

  const loose=arts.filter(a=>!(+a.week>=1&&+a.week<=wk.length));
  if(loose.length)artBlocks+=`<div class="wk"><div class="wkh"><b>Outras artes do mês</b></div><div class="arts">${loose.map(fig).join("")}</div></div>`;
  const time=fmtHour;

document.querySelectorAll(".carw").forEach(function(w){

  var step=function(){return s.clientWidth+10},cur=0,lock=0;
  var go=function(d){cur=Math.max(0,Math.min(n-1,cur+d));lock=Date.now()+700;s.scrollTo({left:cur*step(),behavior:"smooth"});show(cur)};
  var show=function(i){pos.textContent=(i+1)+" de "+n;prev.disabled=i===0;next.disabled=i>=n-1};
  prev.onclick=function(){go(-1)};next.onclick=function(){go(1)};
  var upd=function(){if(Date.now()<lock)return;cur=Math.min(n-1,Math.round(s.scrollLeft/step()));show(cur)};
  s.addEventListener("scroll",upd,{passive:true});upd();
});
<\/script>

// quando o navegador não deixa copiar sozinho
function msgModal(msg){
  const w=modal(`<h2>Mensagem para o grupo</h2><div class="form"><textarea class="in" id="mText" rows="12">${esc(msg)}</textarea>
    <p class="hint">Copie, cole no grupo do cliente junto com o arquivo e fixe a mensagem por 30 dias.</p></div>
    <div class="foot"><span class="spacer"></span><button class="btn ghost" id="mClose">Fechar</button><button class="btn primary" id="mCopy">Copiar</button></div>`);
  $("#mClose",w).onclick=()=>w.remove();
  $("#mCopy",w).onclick=async()=>{if(await copyText($("#mText",w).value)){toast("Mensagem copiada.");w.remove()}else{$("#mText",w).select();toast("Selecionei o texto, use Ctrl+C.")}};
}
function saveFile(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
async function deliver(mode){
  const c=client();if(!c)return;
  if(S.uploads>0){toast("Espere as artes terminarem de enviar.");return}
  // abre já no clique, senão o navegador bloqueia a nova aba; o nome reaproveita a aba do WhatsApp se já estiver aberta
  const msg=waMessage(c,S.draft),copied=mode==="download"?null:copyText(msg);
  if(mode==="whatsapp")window.open("https://web.whatsapp.com/","whatsapp-web");
  const btn=$({share:"#share",whatsapp:"#wa"}[mode]||"#download"),label=btn.textContent;btn.disabled=true;btn.textContent="Preparando…";
  try{
    const p=serializePlan(S.draft),imgs={};
    for(const a of p.arts.flatMap(a=>a.gone?[]:[a,...a.cards])){if(!a.url)continue;
      if(a.url.startsWith("data:")){imgs[a.id]=a.url;continue}
      try{imgs[a.id]=await fetch(a.url).then(r=>{if(!r.ok)throw 0;return r.blob()}).then(blobToDataURL)}catch(e){imgs[a.id]=a.url}}
    const html=docHTML(c,p,settings(),a=>imgs[a.id]||a.url);
    const name=`Planejamento ${cap(monthName(p.month))} ${p.month.split("-")[0]} - ${c.name}`.replace(/[\\/:*?"<>|]+/g,"").trim()+".html";
    const blob=new Blob([html],{type:"text/html"});
    if(mode==="share"){
      if(await copied)toast("Mensagem copiada. Depois de enviar o arquivo, cole a mensagem no grupo.",6000);else msgModal(msg);
      try{await navigator.share({files:[new File([blob],name,{type:"text/html"})],title:name,text:msg})}
      catch(e){if(e&&e.name!=="AbortError")saveFile(blob,name)}
    }else if(mode==="whatsapp"){saveFile(blob,name);
      if(await copied)toast("Mensagem copiada e arquivo baixado. No grupo do cliente: cole a mensagem (Ctrl+V), anexe o arquivo pelo clipe › Documento e fixe a mensagem por 30 dias.",14000);
      else msgModal(msg)}
    else{saveFile(blob,name);toast("Arquivo baixado. É só mandar para o cliente.")}
  }catch(e){console.error(e);toast("Não foi possível gerar o arquivo.")}
  btn.disabled=false;btn.textContent=label;
}

async function loadAll(){
  $("#main").innerHTML=`<div class="loading">Carregando…</div>`;
  try{
    const[clients,plans,st,role]=await Promise.all([store.listClients(),store.listPlans(S.month),store.getSettings(),
      store.myRole().catch(e=>{console.error(e);S.adminErr=true;return"equipe"})]);
    S.clients=clients;S.plans=plans;S.settings=st||{};S.admin=role==="admin";S.planOnly=role==="planejamento";
    if(S.admin)await refreshPrivate().catch(e=>{console.error(e);S.adminErr=true});
    S.loaded=true;renderList();
  }catch(e){console.error(e);$("#main").innerHTML=`<div class="empty"><strong>Não foi possível carregar os dados</strong>Confira a internet e os dados do config.js. <br><br><button class="btn primary" onclick="loadAll()">Tentar de novo</button></div>`}
}
async function changeMonth(n){
  flushTimers();S.month=shiftMonth(S.month,n);renderTop();
  try{S.plans=await store.listPlans(S.month)}catch(e){toast("Não foi possível carregar este mês.")}
  if(S.view==="client")openClient(S.clientId);else renderList();
}
$("#mPrev").onclick=()=>changeMonth(-1);
$("#mNext").onclick=()=>changeMonth(1);
$("#openSettings").onclick=settingsModal;
$("#tabs").onclick=e=>{const b=e.target.closest("[data-tab]");if(!b)return;flushTimers();window.scrollTo(0,0);
  if(b.dataset.tab==="plan"){S.view="list";S.clientId=null;S.draft=null;renderList()}else renderClients()};
$("#themeBtn").onclick=()=>{const t=isDark()?"light":"dark";applyTheme(t);try{localStorage.setItem("theme",t)}catch(e){}};
darkMQ.addEventListener("change",paintThemeBtn);
let savedTheme="";try{savedTheme=localStorage.getItem("theme")||""}catch(e){}
applyTheme(savedTheme);
renderTop();
(async()=>{
  if(CFG.SUPABASE_URL&&!window.supabase){$("#main").innerHTML=`<div class="empty"><strong>Não foi possível carregar o Supabase</strong>Confira a internet e recarregue a página.</div>`;return}
  const pub=location.hash.match(/^#cadastro=([\w-]+)$/);
  if(pub)return renderPublicForm(pub[1]);
  if(await store.session())loadAll();else renderLogin();
})();
</script>
</body>
